<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYNIC Particle System - φ qui se voit</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Orbitron', monospace;
      color: #d4a017;
    }

    #container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #video {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 200px;
      border: 2px solid #d4a017;
      border-radius: 8px;
      opacity: 0.8;
      transform: scaleX(-1);
      z-index: 100;
    }

    .hud {
      position: fixed;
      font-size: 12px;
      color: #d4a017;
      text-shadow: 0 0 10px #d4a017;
      z-index: 100;
      pointer-events: none;
    }

    .hud-tl { top: 20px; left: 20px; }
    .hud-tr { top: 20px; right: 20px; text-align: right; }
    .hud-bl { bottom: 20px; left: 20px; }
    .hud-br { bottom: 240px; right: 20px; text-align: right; }

    .hud h3 {
      font-size: 14px;
      margin-bottom: 8px;
      color: #fff;
      text-shadow: 0 0 15px #d4a017;
    }

    .hud .value {
      font-size: 24px;
      font-weight: 700;
    }

    .hud .phi { color: #00ffff; }
    .hud .burn { color: #ff6b35; }
    .hud .verify { color: #00ff88; }
    .hud .culture { color: #ff00ff; }

    .axiom-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 700;
      text-shadow: 0 0 30px currentColor;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      z-index: 100;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 200;
    }

    .loading h1 {
      font-size: 32px;
      margin-bottom: 20px;
      animation: pulse 1.618s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.618; }
    }

    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1) 0px,
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 50;
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%);
      pointer-events: none;
      z-index: 51;
    }

    #error-display {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 300;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <video id="video" autoplay playsinline></video>

  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="hud hud-tl">
    <h3>CYNIC</h3>
    <div>FPS: <span id="fps" class="value phi">60</span></div>
    <div>Particles: <span id="particles" class="value">0</span></div>
  </div>

  <div class="hud hud-tr">
    <h3>1.618...</h3>
    <div>Mode: <span id="mode" class="value phi">IDLE</span></div>
    <div>World: <span id="world" class="value">---</span></div>
  </div>

  <div class="hud hud-bl">
    <div>Left: <span id="left-hand">---</span></div>
    <div>Right: <span id="right-hand">---</span></div>
  </div>

  <div class="hud hud-br">
    <div>Axiom: <span id="axiom" class="value phi">PHI</span></div>
    <div>Doubt: <span id="doubt">38.2%</span></div>
  </div>

  <div class="axiom-indicator" id="axiom-display">PHI</div>

  <div class="loading" id="loading">
    <h1>CYNIC AWAKENING</h1>
    <p>Initializing MediaPipe Hands...</p>
    <p style="font-size: 10px; margin-top: 20px;">phi qui se mefie de phi</p>
  </div>

  <div id="error-display">
    <h1>Camera Error</h1>
    <p id="error-msg">Please allow camera access</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    const PHI = 1.618033988749895;
    const PHI_INV = 1 / PHI;
    const PHI_INV_2 = PHI_INV * PHI_INV;
    const PHI_SQ = PHI * PHI;

    const AXIOMS = {
      PHI: { name: 'PHI', color: 0x00ffff, world: 'ATZILUT', text: '1.618' },
      VERIFY: { name: 'VERIFY', color: 0x00ff88, world: 'BERIAH', text: 'VERIFY' },
      CULTURE: { name: 'CULTURE', color: 0xff00ff, world: 'YETZIRAH', text: 'CULTURE' },
      BURN: { name: 'BURN', color: 0xff6b35, world: 'ASSIAH', text: 'BURN' },
      CYNIC: { name: 'CYNIC', color: 0xd4a017, world: 'DAAT', text: 'CYNIC' },
    };

    const CONFIG = {
      particleCount: Math.round(10000 * PHI),
      particleSize: PHI * 1.5,
      returnSpeed: PHI_INV * 0.25,
      repulsionForce: PHI_SQ,
      scatterForce: PHI * 100,
    };

    let scene, camera, renderer, particles;
    let particlePositions, particleColors, targetPositions;
    let currentAxiom = 'PHI';
    let leftFingers = 0, rightFingers = 0;
    let leftHandPos = null, rightHandPos = null;
    let nebulaMode = false, catchMode = false;
    let lastTime = performance.now();
    let frameCount = 0, fps = 60;

    function initThree() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a0f);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 500;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('container').appendChild(renderer.domElement);

      createParticles();

      const gridHelper = new THREE.GridHelper(1000, 20, 0x1a1a2e, 0x1a1a2e);
      gridHelper.rotation.x = Math.PI / 2;
      gridHelper.position.z = -200;
      scene.add(gridHelper);

      window.addEventListener('resize', onResize);
    }

    function createParticles() {
      const geometry = new THREE.BufferGeometry();
      const count = CONFIG.particleCount;

      particlePositions = new Float32Array(count * 3);
      particleColors = new Float32Array(count * 3);
      targetPositions = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        particlePositions[i3] = (Math.random() - 0.5) * 800;
        particlePositions[i3 + 1] = (Math.random() - 0.5) * 600;
        particlePositions[i3 + 2] = (Math.random() - 0.5) * 200;

        targetPositions[i3] = particlePositions[i3];
        targetPositions[i3 + 1] = particlePositions[i3 + 1];
        targetPositions[i3 + 2] = particlePositions[i3 + 2];

        const color = new THREE.Color(0xd4a017);
        particleColors[i3] = color.r;
        particleColors[i3 + 1] = color.g;
        particleColors[i3 + 2] = color.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

      const material = new THREE.PointsMaterial({
        size: CONFIG.particleSize,
        vertexColors: true,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: 0.9,
        sizeAttenuation: true,
      });

      particles = new THREE.Points(geometry, material);
      scene.add(particles);

      document.getElementById('particles').textContent = count.toLocaleString();
    }

    function textToPositions(text, color) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = 800;
      canvas.height = 200;

      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = 'bold 100px Orbitron, monospace';
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const positions = [];

      const step = 4;
      for (let y = 0; y < canvas.height; y += step) {
        for (let x = 0; x < canvas.width; x += step) {
          const i = (y * canvas.width + x) * 4;
          if (imageData.data[i] > 128) {
            positions.push({
              x: (x - canvas.width / 2) * 1.2,
              y: -(y - canvas.height / 2) * 1.2,
              z: 0,
            });
          }
        }
      }

      return positions;
    }

    function setTargetShape(axiomKey) {
      const axiom = AXIOMS[axiomKey];
      const textPositions = textToPositions(axiom.text, axiom.color);
      const color = new THREE.Color(axiom.color);

      const count = CONFIG.particleCount;

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;

        if (i < textPositions.length) {
          const pos = textPositions[i % textPositions.length];
          targetPositions[i3] = pos.x;
          targetPositions[i3 + 1] = pos.y;
          targetPositions[i3 + 2] = pos.z + (Math.random() - 0.5) * 20;
        } else {
          const angle = (i / count) * Math.PI * 2 * PHI;
          const radius = 300 + Math.random() * 200;
          targetPositions[i3] = Math.cos(angle) * radius;
          targetPositions[i3 + 1] = Math.sin(angle) * radius;
          targetPositions[i3 + 2] = (Math.random() - 0.5) * 100;
        }

        const variation = 0.8 + Math.random() * 0.4;
        particleColors[i3] = color.r * variation;
        particleColors[i3 + 1] = color.g * variation;
        particleColors[i3 + 2] = color.b * variation;
      }

      particles.geometry.attributes.color.needsUpdate = true;

      currentAxiom = axiomKey;
      document.getElementById('axiom').textContent = axiom.name;
      document.getElementById('axiom').className = 'value ' + axiomKey.toLowerCase();
      document.getElementById('world').textContent = axiom.world;

      const display = document.getElementById('axiom-display');
      display.textContent = axiom.text;
      display.style.color = '#' + axiom.color.toString(16).padStart(6, '0');
      display.style.opacity = '1';
      setTimeout(function() { display.style.opacity = '0'; }, 1000);
    }

    function fibonacciSphere(count, radius, center) {
      const positions = [];
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      for (let i = 0; i < count; i++) {
        const y = 1 - (i / (count - 1)) * 2;
        const radiusAtY = Math.sqrt(1 - y * y);
        const theta = goldenAngle * i;

        positions.push({
          x: center.x + Math.cos(theta) * radiusAtY * radius,
          y: center.y + y * radius,
          z: center.z + Math.sin(theta) * radiusAtY * radius,
        });
      }

      return positions;
    }

    function updateParticles(delta) {
      const count = CONFIG.particleCount;
      const time = performance.now() * 0.001;

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;

        let tx = targetPositions[i3];
        let ty = targetPositions[i3 + 1];
        let tz = targetPositions[i3 + 2];

        if (nebulaMode && !catchMode) {
          tx = (Math.sin(i * 0.1 + time) * 0.5 + 0.5) * 800 - 400;
          ty = (Math.cos(i * 0.15 + time * 1.1) * 0.5 + 0.5) * 600 - 300;
          tz = Math.sin(i * 0.05 + time * 0.7) * 300;
        }

        if (catchMode && leftHandPos) {
          const spherePositions = fibonacciSphere(count, 100, leftHandPos);
          if (spherePositions[i]) {
            tx = spherePositions[i].x;
            ty = spherePositions[i].y;
            tz = spherePositions[i].z;

            const bounce = Math.sin(time * 8 + i * 0.01) * 20;
            ty += bounce;
          }
        }

        if (rightHandPos && !nebulaMode) {
          const dx = particlePositions[i3] - rightHandPos.x;
          const dy = particlePositions[i3 + 1] - rightHandPos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 150) {
            const force = (150 - dist) / 150 * CONFIG.repulsionForce;
            particlePositions[i3] += (dx / dist) * force;
            particlePositions[i3 + 1] += (dy / dist) * force;
          }
        }

        if (nebulaMode && rightHandPos) {
          const dx = particlePositions[i3] - rightHandPos.x;
          const dy = particlePositions[i3 + 1] - rightHandPos.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 300) {
            const wave = Math.sin(dist * 0.05 - time * 5) * 30 * (1 - dist / 300);
            particlePositions[i3 + 2] += wave * delta;
          }
        }

        const speed = CONFIG.returnSpeed * (catchMode ? 2 : 1);
        particlePositions[i3] += (tx - particlePositions[i3]) * speed;
        particlePositions[i3 + 1] += (ty - particlePositions[i3 + 1]) * speed;
        particlePositions[i3 + 2] += (tz - particlePositions[i3 + 2]) * speed;
      }

      particles.geometry.attributes.position.needsUpdate = true;

      if (catchMode) {
        particles.rotation.y += delta * PHI_INV;
      } else {
        particles.rotation.y *= 0.95;
      }
    }

    function countFingers(landmarks) {
      const fingerTips = [8, 12, 16, 20];
      const fingerPips = [6, 10, 14, 18];
      let count = 0;

      if (landmarks[4].x < landmarks[3].x) count++;

      for (let i = 0; i < 4; i++) {
        if (landmarks[fingerTips[i]].y < landmarks[fingerPips[i]].y) {
          count++;
        }
      }

      return count;
    }

    function landmarkTo3D(landmark) {
      return {
        x: (0.5 - landmark.x) * 800,
        y: (0.5 - landmark.y) * 600,
        z: -landmark.z * 500,
      };
    }

    function onHandsResults(results) {
      leftFingers = 0;
      rightFingers = 0;
      leftHandPos = null;
      rightHandPos = null;

      if (results.multiHandLandmarks && results.multiHandedness) {
        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const landmarks = results.multiHandLandmarks[i];
          const handedness = results.multiHandedness[i].label;
          const fingers = countFingers(landmarks);

          if (handedness === 'Right') {
            leftFingers = fingers;
            leftHandPos = landmarkTo3D(landmarks[9]);
            document.getElementById('left-hand').textContent = fingers + ' fingers';
          } else {
            rightFingers = fingers;
            rightHandPos = landmarkTo3D(landmarks[8]);
            document.getElementById('right-hand').textContent = fingers + ' fingers';
          }
        }
      }

      nebulaMode = rightFingers === 5;
      catchMode = leftFingers === 5 && nebulaMode;

      if (!catchMode) {
        switch (leftFingers) {
          case 1: setTargetShape('PHI'); break;
          case 2: setTargetShape('VERIFY'); break;
          case 3: setTargetShape('CULTURE'); break;
          case 4: setTargetShape('BURN'); break;
        }
      }

      let mode = 'IDLE';
      if (catchMode) mode = 'CATCH';
      else if (nebulaMode) mode = 'NEBULA';
      else if (leftFingers > 0) mode = AXIOMS[currentAxiom].name;

      document.getElementById('mode').textContent = mode;

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        document.getElementById('left-hand').textContent = '---';
        document.getElementById('right-hand').textContent = '---';
      }
    }

    async function initMediaPipe() {
      const video = document.getElementById('video');

      const hands = new Hands({
        locateFile: function(file) { return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file; }
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.5,
      });

      hands.onResults(onHandsResults);

      const cam = new Camera(video, {
        onFrame: async function() {
          await hands.send({ image: video });
        },
        width: 640,
        height: 480,
      });

      await cam.start();

      document.getElementById('loading').style.display = 'none';
    }

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      frameCount++;
      if (frameCount >= 30) {
        fps = Math.round(1000 / (delta * 1000));
        document.getElementById('fps').textContent = fps;
        frameCount = 0;
      }

      updateParticles(delta);
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // === KEYBOARD DEMO MODE ===
    function initKeyboardControls() {
      // Hide camera error and video frame
      document.getElementById('error-display').style.display = 'none';
      document.getElementById('video').style.display = 'none';

      const instructions = document.createElement('div');
      instructions.className = 'hud';
      instructions.style.cssText = 'bottom: 250px; left: 20px; font-size: 10px; opacity: 0.6;';
      instructions.innerHTML = `
        <div style="color: #00ffff;">KEYBOARD MODE</div>
        <div>1 = PHI | 2 = VERIFY | 3 = CULTURE | 4 = BURN</div>
        <div>5 = CYNIC | SPACE = Nebula | C = Catch</div>
        <div>Mouse = Hand position</div>
      `;
      document.body.appendChild(instructions);

      // Track mouse as hand position
      document.addEventListener('mousemove', (e) => {
        const x = (0.5 - e.clientX / window.innerWidth) * 800;
        const y = (0.5 - e.clientY / window.innerHeight) * 600;
        rightHandPos = { x, y, z: 0 };
        leftHandPos = { x, y, z: 0 };
      });

      document.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();

        if (key >= '1' && key <= '5') {
          const axiomKeys = ['PHI', 'VERIFY', 'CULTURE', 'BURN', 'CYNIC'];
          const idx = parseInt(key) - 1;
          leftFingers = parseInt(key);
          currentAxiom = axiomKeys[idx];
          setTargetShape(axiomKeys[idx]);
          document.getElementById('left-hand').textContent = key + ' fingers';
          document.getElementById('axiom').textContent = axiomKeys[idx];
        }

        if (key === ' ' || key === 'spacebar') {
          e.preventDefault();
          nebulaMode = !nebulaMode;
          rightFingers = nebulaMode ? 5 : 0;
          document.getElementById('right-hand').textContent = nebulaMode ? '5 fingers (NEBULA)' : '---';
          document.getElementById('mode').textContent = nebulaMode ? 'NEBULA' : 'IDLE';
        }

        if (key === 'c') {
          catchMode = !catchMode;
          document.getElementById('mode').textContent = catchMode ? 'CATCH' : (nebulaMode ? 'NEBULA' : 'IDLE');
        }
      });
    }

    async function init() {
      initThree();
      setTargetShape('CYNIC');

      try {
        await initMediaPipe();
      } catch (err) {
        console.error('MediaPipe error:', err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-display').style.display = 'block';
        document.getElementById('error-msg').textContent = err.message;

        // Fallback to keyboard controls
        initKeyboardControls();
      }

      animate();
    }

    init();
  </script>
</body>
</html>
