name: Weekly Merkle Snapshot

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview only)'
        required: false
        default: 'false'
      force:
        description: 'Force republish'
        required: false
        default: 'false'
      network:
        description: 'Solana network'
        required: false
        default: 'devnet'
        type: choice
        options:
          - devnet
          - mainnet-beta

env:
  NODE_VERSION: '20'

jobs:
  snapshot:
    name: Publish Merkle Snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Solana keypair
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Run weekly snapshot
        env:
          SOLANA_NETWORK: ${{ github.event.inputs.network || 'devnet' }}
          SOLANA_KEYPAIR: ~/.config/solana/id.json
          SNAPSHOT_WEBHOOK_URL: ${{ secrets.SNAPSHOT_WEBHOOK_URL }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          node scripts/weekly-snapshot.js $FLAGS

      - name: Commit snapshot files
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add knowledge/provenance/
          git diff --staged --quiet || git commit -m "chore: weekly snapshot $(date +%Y-W%V)"
          git push

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ github.run_number }}
          path: knowledge/provenance/snapshot-*.json
          retention-days: 90

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: snapshot
    if: failure()

    steps:
      - name: Send failure notification
        env:
          WEBHOOK_URL: ${{ secrets.SNAPSHOT_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d '{"text": "❌ Weekly snapshot failed! Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
          fi
