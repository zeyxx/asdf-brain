[package]
name = "asdf-merkle"
version = "0.1.0"
description = "asdf-brain Merkle Root Storage - Don't trust, verify"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "asdf_merkle"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
solana-sha256-hasher = "2.3"
